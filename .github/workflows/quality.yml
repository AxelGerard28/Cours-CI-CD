# L'analyse SonarQube, sur le runner de votre poste.
name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sonar:
    runs-on: [self-hosted, local] # SonarQube tourne sur votre poste
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : SonarQube repère le « nouveau code »
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:coverage # produit coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # confidentiel : masqué dans les journaux
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} # une simple valeur de configuration
